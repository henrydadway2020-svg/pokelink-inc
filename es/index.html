<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>TCGmini — Cards, decks and matches for Pokémon TCG Pocket</title>
<meta name="description" content="Cards, decks and matches for Pokémon TCG Pocket in one place. Board, advanced card search, deck builder, tier list and draft.">
<meta name="theme-color" content="#111118">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://googleapis.com">
<link href="https://googleapis.com/css2?family=Nunito:wght=600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="pb-glass-warp" x="-30%" y="-30%" width="160%" height="160%">
    <feTurbulence type="fractalNoise" baseFrequency="0.012 0.012" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="36" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs></svg>

<!-- ══ APP NAV TABS ══ -->
<nav id="app-nav">
  <button id="app-nav-burger" type="button" aria-label="Menú" aria-expanded="false" onclick="window.toggleAppDrawer&&toggleAppDrawer()">
    <svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
  </button>
  <div id="app-nav-logo" title="TCGmini"><svg viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect x="7" y="5" width="13" height="18" rx="2.5" fill="none" stroke="#4dabff" stroke-width="2"/><rect x="13" y="9" width="13" height="18" rx="2.5" fill="#111118" stroke="#ff6b6b" stroke-width="2"/></svg><span id="app-nav-brand">TCGmini</span></div>
  <div id="app-nav-tabs">
  <a class="app-tab" id="app-tab-jugar" href="/" onclick="switchAppTab('jugar');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4.5 L19 12 L7 19.5 Z" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="nav.home">Inicio</span>
  </a>
  <a class="app-tab" id="app-tab-board" href="/tablero" onclick="switchAppTab('board');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7.5" y="2.6" width="9" height="12.6" rx="1.5"/><circle cx="5.6" cy="19" r="1.5" fill="currentColor" stroke="none"/><circle cx="12" cy="19" r="1.5" fill="currentColor" stroke="none"/><circle cx="18.4" cy="19" r="1.5" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="nav.board">Tablero</span>
  </a>
  <a class="app-tab" id="app-tab-cards" href="/cartas" onclick="switchAppTab('cards');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.7"/><line x1="15.4" y1="15.4" x2="20.2" y2="20.2"/></svg>
    <span data-i18n="nav.cards">Cartas</span>
  </a>
  <a class="app-tab" id="app-tab-mazos" href="/mazos" onclick="if(window._mazosOpenMine)window._mazosOpenMine();else switchAppTab('mazos');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="11" height="15.4" rx="1.8"/><path d="M15 5.4 L16 5.4 A1.6 1.6 0 0 1 17.6 7 L17.6 19.2 A1.6 1.6 0 0 1 16 20.8 L8.2 20.8 A1.6 1.6 0 0 1 6.6 19.2 L6.6 18.4 L15 18.4 Z" fill="currentColor" stroke="none"/></svg>
    <span data-i18n="nav.myDecks">Barajas</span>
  </a>
  <a class="app-tab" id="app-tab-meta" href="/meta" onclick="if(window._mazosOpenMeta)window._mazosOpenMeta();else switchAppTab('meta');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="20" x2="5" y2="12"/><line x1="12" y1="20" x2="12" y2="5"/><line x1="19" y1="20" x2="19" y2="9.5"/></svg>
    <span data-i18n="nav.meta">Meta</span>
  </a>
  <a class="app-tab" id="app-tab-draft" href="/draft" onclick="switchAppTab('draft');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2.9" y="5.1" width="9.4" height="13.16" rx="1.6" transform="rotate(-11 7.6 11.7)"/><rect x="11.7" y="5.1" width="9.4" height="13.16" rx="1.6" transform="rotate(11 16.4 11.7)"/></svg>
    <span data-i18n="nav.draft">Draft</span>
  </a>
  <a class="app-tab" id="app-tab-tierlist" href="/tierlist" onclick="switchAppTab('tierlist');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="1.6"/><line x1="3" y1="12" x2="21" y2="12"/></svg>
    <span data-i18n="nav.tierlist">Tierlist</span>
  </a>
  <a class="app-tab" id="app-tab-perfil" href="/perfil" onclick="switchAppTab('perfil');return false;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.8-3.4 4.6-5 8-5s6.2 1.6 8 5"/></svg>
    <span data-i18n="nav.profile">Perfil</span>
  </a>
  </div>

  <div id="app-nav-right">
    <div id="lang-select">
      <button id="lang-current" type="button" aria-haspopup="true" aria-expanded="false" title="Idioma / Language">ES</button>
      <div id="lang-menu" role="menu">
        <button data-lang="es" role="menuitem">Español</button>
        <button data-lang="en" role="menuitem">English</button>
        <button data-lang="ja" role="menuitem">日本語</button>
      </div>
    </div>
    <div id="app-nav-sep"></div>
    <button id="app-gear-btn" onclick="window.toggleSbSettings&&toggleSbSettings(event)" title="Ajustes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </div>
</nav>

<!-- VISTA PRINCIPAL DEL JUEGO (EL TABLERO REALTARGET) -->
<div id="page-wrap">
  <div id="game-board">
    <!-- El motor de JS pintará dinámicamente las zonas aquí (Mazo, Banca, Activo, Premios) -->
    <div id="board-grid"></div>
  </div>
</div>
